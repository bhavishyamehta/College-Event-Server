ktor:
  application:
    modules:
      - com.example.ApplicationKt.module
  deployment:
    port: 8080

# ── MySQL Database Config ─────────────────────────────────────────────
db:
  driver: "${DB_DRIVER:-com.mysql.cj.jdbc.Driver}"
  url: "${DB_URL:-jdbc:mysql://localhost:3306/college_event_db?useSSL=false&serverTimezone=UTC}"
  user: "${DB_USER:-root}"
  password: "${DB_PASSWORD:-password}"
  maxPoolSize: "${DB_POOL_SIZE:-10}"

# ── JWT Security Config ───────────────────────────────────────────────
jwt:
  secret: "${JWT_SECRET:-default_secret_key_minimum_32_characters_long}"
  issuer: "${JWT_ISSUER:-college_event}"
  audience: "${JWT_AUDIENCE:-college_event_students}"
  realm: "${JWT_REALM:-college-event-tracker}"
  expirationMs: "${JWT_EXPIRATION_MS:-86400000}"

# ── App Seeding Flag ──────────────────────────────────────────────────
app:
  seedDatabase: "${SEED_DATABASE:-false}"